<svg xmlns="http://www.w3.org/2000/svg" width="368" height="434" viewBox="0 0 368 434" role="img" aria-label="Rotor layout of a quadcopter in the plus configuration, shown in the body frame">
  <defs>
    <marker id="axh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="cw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ccw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="368" height="434" fill="#f8fafc"/>

  <g transform="translate(-12,-12)">
    <rect x="12" y="12" width="368" height="378" rx="14" fill="#eef2ff"/>

    <text x="196" y="50" font-family="Georgia, serif" font-size="21" fill="#1e3a8a" text-anchor="middle" font-weight="bold">&#8220;+&#8221; configuration</text>

    <g stroke="#9aa8b8" stroke-width="8" stroke-linecap="round">
      <line x1="112" y1="218" x2="280" y2="218"/>
      <line x1="196" y1="134" x2="196" y2="302"/>
    </g>

    <!-- body axes sit on top of the arms -->
    <g stroke="#1e3a8a" stroke-width="3.2" marker-end="url(#axh)">
      <line x1="196" y1="218" x2="252" y2="218"/>
      <line x1="196" y1="218" x2="196" y2="162"/>
    </g>
    <g font-family="Georgia, serif" font-size="17" fill="#1e3a8a" font-style="italic" font-weight="bold">
      <text x="248" y="240">x</text>
      <text x="206" y="172">y</text>
    </g>
    <circle cx="196" cy="218" r="7.5" fill="#1e3a8a"/>

    <!-- rotor 1 (l, 0)  CW -->
    <circle cx="288" cy="218" r="25" fill="#ffffff" stroke="#2563eb" stroke-width="4.5"/>
    <path d="M 274.9 205.6 A 18 18 0 0 1 300.4 205.6" fill="none" stroke="#2563eb" stroke-width="3.4" marker-end="url(#cw)"/>
    <!-- rotor 3 (-l, 0)  CW -->
    <circle cx="104" cy="218" r="25" fill="#ffffff" stroke="#2563eb" stroke-width="4.5"/>
    <path d="M 90.9 205.6 A 18 18 0 0 1 116.4 205.6" fill="none" stroke="#2563eb" stroke-width="3.4" marker-end="url(#cw)"/>
    <!-- rotor 2 (0, l)  CCW -->
    <circle cx="196" cy="126" r="25" fill="#ffffff" stroke="#ea580c" stroke-width="4.5"/>
    <path d="M 208.4 113.6 A 18 18 0 0 0 182.9 113.6" fill="none" stroke="#ea580c" stroke-width="3.4" marker-end="url(#ccw)"/>
    <!-- rotor 4 (0, -l)  CCW -->
    <circle cx="196" cy="310" r="25" fill="#ffffff" stroke="#ea580c" stroke-width="4.5"/>
    <path d="M 208.4 297.6 A 18 18 0 0 0 182.9 297.6" fill="none" stroke="#ea580c" stroke-width="3.4" marker-end="url(#ccw)"/>

    <g font-family="Georgia, serif" font-size="18" font-weight="bold" text-anchor="middle">
      <text x="288" y="230" fill="#2563eb">1</text>
      <text x="196" y="138" fill="#ea580c">2</text>
      <text x="104" y="230" fill="#2563eb">3</text>
      <text x="196" y="322" fill="#ea580c">4</text>
    </g>
    <g font-family="Georgia, serif" font-size="15" fill="#334e68" text-anchor="middle">
      <text x="300" y="264">(l, 0)</text>
      <text x="196" y="90">(0, l)</text>
      <text x="92"  y="264">(&#8722;l, 0)</text>
      <text x="196" y="356">(0, &#8722;l)</text>
    </g>
    <text x="196" y="378" font-family="Georgia, serif" font-size="15" fill="#1e3a8a" text-anchor="middle">l = arm length (center to rotor)</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g font-family="Georgia, serif" font-size="14" fill="#334e68">
    <circle cx="16" cy="400" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="3.6"/>
    <path d="M 9.4 394.2 A 8.6 8.6 0 0 1 21.6 394.2" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#cw)"/>
    <text x="32" y="405">rotors 1, 3 &#8212; clockwise</text>

    <circle cx="190" cy="400" r="10" fill="#ffffff" stroke="#ea580c" stroke-width="3.6"/>
    <path d="M 196.6 394.2 A 8.6 8.6 0 0 0 184.4 394.2" fill="none" stroke="#ea580c" stroke-width="2.4" marker-end="url(#ccw)"/>
    <text x="206" y="405">rotors 2, 4 &#8212; counter-clockwise</text>
  </g>
  <text x="184" y="426" font-family="Georgia, serif" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">Top view, looking down the world z-axis.</text>
</svg>
