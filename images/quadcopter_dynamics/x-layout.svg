<svg xmlns="http://www.w3.org/2000/svg" width="368" height="434" viewBox="0 0 368 434" role="img" aria-label="Rotor layout of a quadcopter in the X configuration, shown in the body frame">
  <defs>
    <marker id="axh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="cw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ccw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="368" height="434" fill="#f8fafc"/>

  <g transform="translate(-400,-12)">
    <rect x="400" y="12" width="368" height="378" rx="14" fill="#eef2ff"/>

    <text x="584" y="50" font-family="Georgia, serif" font-size="21" fill="#1e3a8a" text-anchor="middle" font-weight="bold">&#8220;X&#8221; configuration</text>

    <g stroke="#9aa8b8" stroke-width="8" stroke-linecap="round">
      <line x1="536" y1="170" x2="632" y2="266"/>
      <line x1="632" y1="170" x2="536" y2="266"/>
    </g>
    <g stroke="#1e3a8a" stroke-width="3.2" marker-end="url(#axh)">
      <line x1="584" y1="218" x2="644" y2="218"/>
      <line x1="584" y1="218" x2="584" y2="158"/>
    </g>
    <g font-family="Georgia, serif" font-size="17" fill="#1e3a8a" font-style="italic" font-weight="bold">
      <text x="636" y="240">x</text>
      <text x="594" y="172">y</text>
    </g>
    <circle cx="584" cy="218" r="7.5" fill="#1e3a8a"/>

    <!-- rotor 1 (l, l)  CW -->
    <circle cx="650" cy="152" r="25" fill="#ffffff" stroke="#2563eb" stroke-width="4.5"/>
    <path d="M 636.9 139.6 A 18 18 0 0 1 662.4 139.6" fill="none" stroke="#2563eb" stroke-width="3.4" marker-end="url(#cw)"/>
    <!-- rotor 3 (-l, -l)  CW -->
    <circle cx="518" cy="284" r="25" fill="#ffffff" stroke="#2563eb" stroke-width="4.5"/>
    <path d="M 504.9 271.6 A 18 18 0 0 1 530.4 271.6" fill="none" stroke="#2563eb" stroke-width="3.4" marker-end="url(#cw)"/>
    <!-- rotor 2 (l, -l)  CCW -->
    <circle cx="650" cy="284" r="25" fill="#ffffff" stroke="#ea580c" stroke-width="4.5"/>
    <path d="M 662.4 271.6 A 18 18 0 0 0 636.9 271.6" fill="none" stroke="#ea580c" stroke-width="3.4" marker-end="url(#ccw)"/>
    <!-- rotor 4 (-l, l)  CCW -->
    <circle cx="518" cy="152" r="25" fill="#ffffff" stroke="#ea580c" stroke-width="4.5"/>
    <path d="M 530.4 139.6 A 18 18 0 0 0 504.9 139.6" fill="none" stroke="#ea580c" stroke-width="3.4" marker-end="url(#ccw)"/>

    <g font-family="Georgia, serif" font-size="18" font-weight="bold" text-anchor="middle">
      <text x="650" y="164" fill="#2563eb">1</text>
      <text x="650" y="296" fill="#ea580c">2</text>
      <text x="518" y="296" fill="#2563eb">3</text>
      <text x="518" y="164" fill="#ea580c">4</text>
    </g>
    <g font-family="Georgia, serif" font-size="15" fill="#334e68" text-anchor="middle">
      <text x="706" y="134">(l, l)</text>
      <text x="710" y="318">(l, &#8722;l)</text>
      <text x="460" y="318">(&#8722;l, &#8722;l)</text>
      <text x="464" y="134">(&#8722;l, l)</text>
    </g>
    <text x="584" y="378" font-family="Georgia, serif" font-size="15" fill="#1e3a8a" text-anchor="middle">l = half-span; arm length = &#8730;2 &#183; l</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g font-family="Georgia, serif" font-size="14" fill="#334e68">
    <circle cx="16" cy="400" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="3.6"/>
    <path d="M 9.4 394.2 A 8.6 8.6 0 0 1 21.6 394.2" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#cw)"/>
    <text x="32" y="405">rotors 1, 3 &#8212; clockwise</text>

    <circle cx="190" cy="400" r="10" fill="#ffffff" stroke="#ea580c" stroke-width="3.6"/>
    <path d="M 196.6 394.2 A 8.6 8.6 0 0 0 184.4 394.2" fill="none" stroke="#ea580c" stroke-width="2.4" marker-end="url(#ccw)"/>
    <text x="206" y="405">rotors 2, 4 &#8212; counter-clockwise</text>
  </g>
  <text x="184" y="426" font-family="Georgia, serif" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">Top view, looking down the world z-axis.</text>
</svg>
