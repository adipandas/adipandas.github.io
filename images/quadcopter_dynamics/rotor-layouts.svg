<svg xmlns="http://www.w3.org/2000/svg" width="780" height="472" viewBox="0 0 780 472" role="img" aria-label="Rotor layouts of a quadcopter in the plus and X configurations, shown in the body frame">
  <defs>
    <marker id="axh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="cw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ccw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="780" height="472" fill="#f8fafc"/>
  <rect x="12" y="12" width="368" height="378" rx="14" fill="#eef2ff"/>
  <rect x="400" y="12" width="368" height="378" rx="14" fill="#eef2ff"/>

  <g font-family="Georgia, serif" font-size="21" fill="#1e3a8a" text-anchor="middle" font-weight="bold">
    <text x="196" y="50">&#8220;+&#8221; configuration</text>
    <text x="584" y="50">&#8220;X&#8221; configuration</text>
  </g>

  <!-- ===================== PLUS ===================== -->
  <g stroke="#9aa8b8" stroke-width="8" stroke-linecap="round">
    <line x1="112" y1="218" x2="280" y2="218"/>
    <line x1="196" y1="134" x2="196" y2="302"/>
  </g>

  <!-- body axes sit on top of the arms -->
  <g stroke="#1e3a8a" stroke-width="3.2" marker-end="url(#axh)">
    <line x1="196" y1="218" x2="252" y2="218"/>
    <line x1="196" y1="218" x2="196" y2="162"/>
  </g>
  <g font-family="Georgia, serif" font-size="17" fill="#1e3a8a" font-style="italic" font-weight="bold">
    <text x="248" y="240">x</text>
    <text x="206" y="172">y</text>
  </g>
  <circle cx="196" cy="218" r="7.5" fill="#1e3a8a"/>

  <!-- rotor 1 (l, 0)  CW -->
  <circle cx="288" cy="218" r="25" fill="#ffffff" stroke="#2563eb" stroke-width="4.5"/>
  <path d="M 274.9 205.6 A 18 18 0 0 1 300.4 205.6" fill="none" stroke="#2563eb" stroke-width="3.4" marker-end="url(#cw)"/>
  <!-- rotor 3 (-l, 0)  CW -->
  <circle cx="104" cy="218" r="25" fill="#ffffff" stroke="#2563eb" stroke-width="4.5"/>
  <path d="M 90.9 205.6 A 18 18 0 0 1 116.4 205.6" fill="none" stroke="#2563eb" stroke-width="3.4" marker-end="url(#cw)"/>
  <!-- rotor 2 (0, l)  CCW -->
  <circle cx="196" cy="126" r="25" fill="#ffffff" stroke="#ea580c" stroke-width="4.5"/>
  <path d="M 208.4 113.6 A 18 18 0 0 0 182.9 113.6" fill="none" stroke="#ea580c" stroke-width="3.4" marker-end="url(#ccw)"/>
  <!-- rotor 4 (0, -l)  CCW -->
  <circle cx="196" cy="310" r="25" fill="#ffffff" stroke="#ea580c" stroke-width="4.5"/>
  <path d="M 208.4 297.6 A 18 18 0 0 0 182.9 297.6" fill="none" stroke="#ea580c" stroke-width="3.4" marker-end="url(#ccw)"/>

  <g font-family="Georgia, serif" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="288" y="230" fill="#2563eb">1</text>
    <text x="196" y="138" fill="#ea580c">2</text>
    <text x="104" y="230" fill="#2563eb">3</text>
    <text x="196" y="322" fill="#ea580c">4</text>
  </g>
  <g font-family="Georgia, serif" font-size="15" fill="#334e68" text-anchor="middle">
    <text x="300" y="264">(l, 0)</text>
    <text x="196" y="90">(0, l)</text>
    <text x="92"  y="264">(&#8722;l, 0)</text>
    <text x="196" y="356">(0, &#8722;l)</text>
  </g>
  <text x="196" y="378" font-family="Georgia, serif" font-size="15" fill="#1e3a8a" text-anchor="middle">l = arm length (centre to rotor)</text>

  <!-- ===================== X ===================== -->
  <g stroke="#9aa8b8" stroke-width="8" stroke-linecap="round">
    <line x1="536" y1="170" x2="632" y2="266"/>
    <line x1="632" y1="170" x2="536" y2="266"/>
  </g>
  <g stroke="#1e3a8a" stroke-width="3.2" marker-end="url(#axh)">
    <line x1="584" y1="218" x2="644" y2="218"/>
    <line x1="584" y1="218" x2="584" y2="158"/>
  </g>
  <g font-family="Georgia, serif" font-size="17" fill="#1e3a8a" font-style="italic" font-weight="bold">
    <text x="636" y="240">x</text>
    <text x="594" y="172">y</text>
  </g>
  <circle cx="584" cy="218" r="7.5" fill="#1e3a8a"/>

  <!-- rotor 1 (l, l)  CW -->
  <circle cx="650" cy="152" r="25" fill="#ffffff" stroke="#2563eb" stroke-width="4.5"/>
  <path d="M 636.9 139.6 A 18 18 0 0 1 662.4 139.6" fill="none" stroke="#2563eb" stroke-width="3.4" marker-end="url(#cw)"/>
  <!-- rotor 3 (-l, -l)  CW -->
  <circle cx="518" cy="284" r="25" fill="#ffffff" stroke="#2563eb" stroke-width="4.5"/>
  <path d="M 504.9 271.6 A 18 18 0 0 1 530.4 271.6" fill="none" stroke="#2563eb" stroke-width="3.4" marker-end="url(#cw)"/>
  <!-- rotor 2 (l, -l)  CCW -->
  <circle cx="650" cy="284" r="25" fill="#ffffff" stroke="#ea580c" stroke-width="4.5"/>
  <path d="M 662.4 271.6 A 18 18 0 0 0 636.9 271.6" fill="none" stroke="#ea580c" stroke-width="3.4" marker-end="url(#ccw)"/>
  <!-- rotor 4 (-l, l)  CCW -->
  <circle cx="518" cy="152" r="25" fill="#ffffff" stroke="#ea580c" stroke-width="4.5"/>
  <path d="M 530.4 139.6 A 18 18 0 0 0 504.9 139.6" fill="none" stroke="#ea580c" stroke-width="3.4" marker-end="url(#ccw)"/>

  <g font-family="Georgia, serif" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="650" y="164" fill="#2563eb">1</text>
    <text x="650" y="296" fill="#ea580c">2</text>
    <text x="518" y="296" fill="#2563eb">3</text>
    <text x="518" y="164" fill="#ea580c">4</text>
  </g>
  <g font-family="Georgia, serif" font-size="15" fill="#334e68" text-anchor="middle">
    <text x="706" y="134">(l, l)</text>
    <text x="710" y="318">(l, &#8722;l)</text>
    <text x="460" y="318">(&#8722;l, &#8722;l)</text>
    <text x="464" y="134">(&#8722;l, l)</text>
  </g>
  <text x="584" y="378" font-family="Georgia, serif" font-size="15" fill="#1e3a8a" text-anchor="middle">l = half-span; arm length = &#8730;2 &#183; l</text>

  <!-- ===================== LEGEND ===================== -->
  <g font-family="Georgia, serif" font-size="15" fill="#334e68">
    <circle cx="176" cy="420" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
    <path d="M 169 413.5 A 9.5 9.5 0 0 1 182.5 413.5" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#cw)"/>
    <text x="196" y="425">rotors 1, 3 &#8212; clockwise</text>

    <circle cx="432" cy="420" r="11" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
    <path d="M 439 413.5 A 9.5 9.5 0 0 0 425.5 413.5" fill="none" stroke="#ea580c" stroke-width="2.4" marker-end="url(#ccw)"/>
    <text x="452" y="425">rotors 2, 4 &#8212; anti-clockwise</text>
  </g>
  <text x="390" y="456" font-family="Georgia, serif" font-size="14" fill="#64748b" text-anchor="middle" font-style="italic">Top view (looking down the world z-axis). The reaction torque on the airframe is opposite to each rotor&#8217;s spin.</text>
</svg>
