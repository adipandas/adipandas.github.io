{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" type="image/png" href="{{ base_path }}/images/site-logo.png">
<link rel="apple-touch-icon" href="{{ base_path }}/images/site-logo.png">
<link rel="manifest" href="{{ base_path }}/images/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<style>
  /* Scroll wide equations inside the column instead of forcing the page to scroll. */
  .page__content .MJXc-display,
  .page__content .MathJax_Display {
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
  }

  /* Same idea for wide tables on narrow screens. */
  .page__content table {
    display: block;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
  }
</style>

<!-- end custom head snippets -->
